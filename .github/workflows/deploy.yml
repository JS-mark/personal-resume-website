name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一份；新提交会取消进行中的部署，避免相互覆盖
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # 仓库子路径形态：发布到 https://<user>.github.io/<REPO>/
  # 改成自定义域名时把这一行改回 '/' 即可
  BASE_PATH: /personal-resume-website/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Remotion 渲染所需的系统库（Chromium + ffmpeg）
      - name: Install system deps for Remotion
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 \
            libxkbcommon0 libpango-1.0-0 libcairo2 libasound2

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint && pnpm typecheck && pnpm test

      # 缓存 Remotion 下载的 Chromium，避免每次重新下载
      - name: Cache Remotion Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/remotion
          key: remotion-chromium-${{ runner.os }}-v4

      # 渲染产物按 composition 源码 + 简历数据哈希缓存
      - name: Cache rendered videos
        id: cache-videos
        uses: actions/cache@v4
        with:
          path: |
            apps/web/public/videos
            apps/web/public/manifest.json
          key: videos-${{ hashFiles('apps/remotion/src/**', 'packages/data/src/**') }}

      - name: Render Remotion videos
        if: steps.cache-videos.outputs.cache-hit != 'true'
        run: pnpm render

      - name: Build web
        env:
          BASE_PATH: ${{ env.BASE_PATH }}
        run: pnpm --filter web build

      # SPA fallback：GitHub Pages 不支持 _redirects，需要 404.html 兜底；
      # 加 .nojekyll 让以下划线开头的资源（如 chunks）不被忽略
      - name: Prepare SPA fallback for GitHub Pages
        run: |
          cp apps/web/dist/index.html apps/web/dist/404.html
          touch apps/web/dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
